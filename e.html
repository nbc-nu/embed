<!DOCTYPE html>
<html lang="pt-BR" style="margin:0;padding:0;overflow:hidden;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0;padding:0;">

    <iframe id="meuIframe" src="" style="width:100vw;height:100vh;border:none;display:block;"></iframe>

    <script>
        function carregarIframe() {
            let hash = window.location.hash;

            if (hash.startsWith('#')) {
                hash = hash.substring(1);
            }

            let linkDestino = '';
            
            if (hash) {
                try {
                    linkDestino = atob(hash);
                } catch (e) {
                    linkDestino = '';
                }
            }

            if (linkDestino && !linkDestino.startsWith('http://') && !linkDestino.startsWith('https://')) {
                linkDestino = 'https://' + linkDestino;
            }

            const iframe = document.getElementById('meuIframe');
            if (linkDestino) {
                iframe.src = linkDestino;
            } else {
                iframe.src = 'data:text/html,%3Ch1%20style%3D%22font-size%3A%2024px%3B%20font-weight%3A%20bold%3B%20margin%3A%200%3B%22%3EEmbeds%3C%2Fh1%3E%3Cbr%3E%3Cpre%3E404%20embed%20not%20found%3C%2Fpre%3E%27';
            }
        }

        carregarIframe();
        window.addEventListener('hashchange', carregarIframe);
    </script>
</body>
</html>
